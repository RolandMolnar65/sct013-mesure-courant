<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f6e56">
<title>Courant ESP32</title>
<style>
  :root { --bg:#ffffff; --fg:#1f2421; --mut:#5f6b64; --card:#f2f5f3; --br:#d5ddd8; --ac:#0f6e56; --acfg:#ffffff; --err:#a32d2d; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14181a; --fg:#e8eeea; --mut:#9aa8a0; --card:#1e2427; --br:#313a3e; --ac:#1d9e75; --acfg:#04342c; --err:#f09595; }
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; max-width:640px; margin-inline:auto; }
  h1 { font-size:20px; font-weight:500; margin:0 0 4px; }
  #etat { color:var(--mut); font-size:14px; margin-bottom:12px; min-height:21px; }
  #etat.err { color:var(--err); }
  .grille { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px; }
  button { font:inherit; padding:12px 8px; border-radius:8px; border:1px solid var(--br); background:var(--card); color:var(--fg); }
  button.prim { background:var(--ac); color:var(--acfg); border-color:var(--ac); grid-column:1 / -1; }
  button:disabled { opacity:.45; }
  .carte { background:var(--card); border:1px solid var(--br); border-radius:12px; padding:12px 14px; margin-bottom:12px; }
  .gros { font-size:32px; font-weight:500; }
  .mut { color:var(--mut); font-size:14px; }
  .stats { display:grid; grid-template-columns:1fr 1fr; gap:8px 16px; }
  .stats div span { display:block; color:var(--mut); font-size:13px; }
  canvas { width:100%; height:200px; display:block; }
  progress { width:100%; height:8px; }
</style>
</head>
<body>
<h1>Courant ESP32</h1>
<div id="etat">Non connecté</div>

<div class="grille">
  <button id="bConnecter" class="prim">Connecter à l'ESP32</button>
  <button id="bLive" disabled>Mesure live</button>
  <button id="bInfo" disabled>Infos fichier</button>
  <button id="bTelecharger" disabled>Télécharger</button>
  <button id="bEffacer" disabled>Effacer le fichier</button>
  <button id="bSeuil" disabled>Régler le seuil</button>
  <button id="bCsv" disabled>Exporter en CSV</button>
</div>

<progress id="prog" value="0" max="1" hidden></progress>

<div class="carte">
  <div class="mut">Dernière mesure live</div>
  <div class="gros" id="live">-- A</div>
  <div class="mut" id="puiss">-- W (230 V, cos φ = 1)</div>
</div>

<div class="carte">
  <div class="mut" id="info">Fichier : --</div>
</div>

<div class="carte" id="resume" hidden>
  <div class="stats">
    <div><span>Temps de chauffe</span><b id="sDuree">--</b></div>
    <div><span>Énergie estimée</span><b id="sKwh">--</b></div>
    <div><span>Période couverte</span><b id="sPeriode">--</b></div>
    <div><span>Nombre de lignes</span><b id="sNb">--</b></div>
    <div><span>Courant moyen</span><b id="sMoy">--</b></div>
    <div><span>Courant max</span><b id="sMax">--</b></div>
  </div>
</div>

<div class="carte" id="graphe" hidden>
  <canvas id="cv"></canvas>
</div>

<script>
const NUS = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const TXU = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";
const RXU = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
const EPOCH_2000 = 946684800;
const TENSION = 230;

const $ = id => document.getElementById(id);
const enc = new TextEncoder();
const dec = new TextDecoder();

let dev = null, rx = null, tx = null;
let buf = "", dl = false, rows = [], attendu = 0, recu = 0, periode = 60;

function etat(msg, err) {
  const e = $("etat");
  e.textContent = msg;
  e.className = err ? "err" : "";
}

function boutons(on) {
  ["bLive", "bInfo", "bTelecharger", "bEffacer", "bSeuil"].forEach(id => $(id).disabled = !on);
}

async function envoyer(texte) {
  const d = enc.encode(texte + "\n");
  if (rx.writeValueWithoutResponse) await rx.writeValueWithoutResponse(d);
  else await rx.writeValue(d);
}

async function connecter() {
  if (!navigator.bluetooth) {
    etat("Web Bluetooth indisponible : utilise Chrome sur Android, page en HTTPS.", true);
    return;
  }
  try {
    etat("Recherche de l'ESP32...");
    dev = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: "ESP32-Courant" }],
      optionalServices: [NUS]
    });
    dev.addEventListener("gattserverdisconnected", () => {
      boutons(false);
      etat("Déconnecté", true);
    });
    etat("Connexion...");
    const srv = await dev.gatt.connect();
    const svc = await srv.getPrimaryService(NUS);
    tx = await svc.getCharacteristic(TXU);
    rx = await svc.getCharacteristic(RXU);
    tx.addEventListener("characteristicvaluechanged", surDonnees);
    await tx.startNotifications();
    boutons(true);
    etat("Connecté à " + dev.name);
    await envoyer("T " + Math.floor(Date.now() / 1000));
    await envoyer("I");
  } catch (e) {
    etat("Échec : " + e.message, true);
  }
}

function surDonnees(ev) {
  const v = ev.target.value;
  if (dl) {
    recu += v.byteLength;
    $("prog").value = Math.min(recu, attendu);
  }
  buf += dec.decode(v, { stream: true });
  let i;
  while ((i = buf.indexOf("\n")) >= 0) {
    const ligne = buf.slice(0, i).replace("\r", "");
    buf = buf.slice(i + 1);
    traiter(ligne);
  }
}

function traiter(l) {
  if (l.startsWith("BEGIN")) {
    dl = true; rows = []; recu = 0;
    attendu = parseInt(l.split(" ")[1]) || 0;
    $("prog").max = Math.max(attendu, 1);
    $("prog").value = 0;
    $("prog").hidden = false;
    etat("Téléchargement en cours...");
  } else if (l === "END") {
    dl = false;
    $("prog").hidden = true;
    finTelechargement();
  } else if (dl) {
    const p = l.split(",");
    if (p.length >= 3) rows.push({ t: +p[0], i: +p[1], m: +p[2], d: +p[3] || periode });
  } else if (l.startsWith("LIVE")) {
    const a = parseFloat(l.split(" ")[1]);
    $("live").textContent = a.toFixed(2) + " A";
    $("puiss").textContent = Math.round(a * TENSION) + " W (230 V, cos φ = 1)";
    etat("Connecté à " + (dev ? dev.name : ""));
  } else if (l.startsWith("INFO")) {
    const p = l.split(" ");
    periode = parseInt(p[3]) || 60;
    $("info").textContent = "Fichier : " + p[1] + " lignes, " + p[2] + " octets. Enregistrement toutes les " +
      periode + " s dès que le courant dépasse " + p[5] + " A. État : " +
      (p[6] === "1" ? "en chauffe" : "en veille") + (p[4] === "1" ? "" : " (horloge non réglée)");
  } else if (l === "OK") {
    etat("Fait");
  }
}

function fmtDuree(s) {
  const j = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return (j ? j + " j " : "") + h + " h " + m + " min";
}

function fmtDate(t) {
  if (t < 300000000) return "T+" + fmtDuree(t);
  return new Date((t + EPOCH_2000) * 1000).toLocaleString("fr-FR", { dateStyle: "short", timeStyle: "short" });
}

function finTelechargement() {
  if (!rows.length) {
    etat("Fichier vide (attendre au moins une minute d'enregistrement)");
    $("resume").hidden = true; $("graphe").hidden = true;
    $("bCsv").disabled = true;
    return;
  }
  etat(rows.length + " lignes reçues");
  $("bCsv").disabled = false;
  const dtot = rows.reduce((s, r) => s + r.d, 0);
  const moy = rows.reduce((s, r) => s + r.i * r.d, 0) / dtot;
  const mx = Math.max(...rows.map(r => r.m));
  const kwh = rows.reduce((s, r) => s + r.i * TENSION * r.d, 0) / 3.6e6;
  const couverte = rows[rows.length - 1].t - rows[0].t + rows[0].d;
  $("sDuree").textContent = fmtDuree(dtot);
  $("sKwh").textContent = kwh.toFixed(3) + " kWh";
  $("sPeriode").textContent = fmtDuree(couverte);
  $("sNb").textContent = rows.length;
  $("sMoy").textContent = moy.toFixed(2) + " A";
  $("sMax").textContent = mx.toFixed(2) + " A";
  $("resume").hidden = false;
  $("graphe").hidden = false;
  dessiner();
}

function dessiner() {
  const cv = $("cv");
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  const c = cv.getContext("2d");
  c.scale(dpr, dpr);
  const fg = getComputedStyle(document.body).color;
  const mut = getComputedStyle(document.documentElement).getPropertyValue("--mut");
  const ac = getComputedStyle(document.documentElement).getPropertyValue("--ac");
  const g = 36, d = 8, b = 20;
  const ymax = Math.max(...rows.map(r => r.m)) * 1.1 || 1;
  const t0 = rows[0].t - rows[0].d, t1 = rows[rows.length - 1].t || t0 + 1;
  const X = t => g + (t - t0) / Math.max(t1 - t0, 1) * (W - g - d);
  const Y = a => H - b - a / ymax * (H - b - d);
  c.strokeStyle = mut; c.fillStyle = mut; c.lineWidth = 0.5; c.font = "11px system-ui";
  c.beginPath(); c.moveTo(g, d); c.lineTo(g, H - b); c.lineTo(W - d, H - b); c.stroke();
  c.textAlign = "right"; c.fillText(ymax.toFixed(1) + " A", g - 4, d + 8);
  c.fillText("0", g - 4, H - b);
  c.textAlign = "left"; c.fillText(fmtDate(t0), g, H - 4);
  c.textAlign = "right"; c.fillText(fmtDate(t1), W - d, H - 4);
  c.strokeStyle = ac.trim() || "#1d9e75"; c.lineWidth = 1.5;
  c.beginPath();
  rows.forEach((r, k) => {
    const x0 = X(r.t - r.d), x1 = X(r.t), y = Y(r.i);
    const trou = k === 0 || (r.t - r.d) - rows[k - 1].t > 5;
    if (trou) c.moveTo(x0, y); else c.lineTo(x0, y);
    c.lineTo(Math.max(x1, x0 + 1), y);
  });
  c.stroke();
}

function exporterCsv() {
  let txt = "horodatage,irms_moy_A,irms_max_A,duree_s\n";
  rows.forEach(r => {
    const h = r.t < 300000000 ? "T+" + r.t + "s" : new Date((r.t + EPOCH_2000) * 1000).toISOString();
    txt += h + "," + r.i + "," + r.m + "," + r.d + "\n";
  });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([txt], { type: "text/csv" }));
  a.download = "courant_" + new Date().toISOString().slice(0, 10) + ".csv";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

$("bConnecter").onclick = connecter;
$("bLive").onclick = () => { etat("Mesure en cours..."); envoyer("L").catch(e => etat(e.message, true)); };
$("bInfo").onclick = () => envoyer("I").catch(e => etat(e.message, true));
$("bTelecharger").onclick = () => { etat("Demande envoyée..."); envoyer("G").catch(e => etat(e.message, true)); };
$("bEffacer").onclick = async () => {
  if (!confirm("Effacer toutes les mesures stockées sur l'ESP32 ?")) return;
  try { await envoyer("C"); await envoyer("I"); } catch (e) { etat(e.message, true); }
};
$("bSeuil").onclick = async () => {
  const v = prompt("Seuil de détection en ampères (environ la moitié du courant du chauffe-eau en chauffe) :", "3");
  if (v === null) return;
  const a = parseFloat(v.replace(",", "."));
  if (!(a > 0)) { etat("Valeur invalide", true); return; }
  try { await envoyer("S " + a); await envoyer("I"); } catch (e) { etat(e.message, true); }
};
$("bCsv").onclick = exporterCsv;
window.addEventListener("resize", () => { if (rows.length) dessiner(); });
</script>
</body>
</html>
